[pytest]
# Pytest configuration for weather pipeline tests

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for categorizing tests
markers =
    completeness: Data completeness tests (all required fields present)
    accuracy: Data accuracy tests (values in valid ranges)
    consistency: Data consistency tests (logical constraints)
    freshness: Data freshness tests (timely data)
    uniqueness: Data uniqueness tests (no unexpected duplicates)
    integration: Integration/end-to-end tests
    slow: Slow running tests
    db: Tests requiring database connection

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage options
[coverage:run]
source = src,tests
omit =
    */site-packages/*
    */distutils/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
