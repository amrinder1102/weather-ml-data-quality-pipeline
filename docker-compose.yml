version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: weather-pipeline-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_pwd
      POSTGRES_DB: weather_pipeline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pipeline:
    build: .
    container_name: weather-pipeline-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_KEY: ${API_KEY:-51e66d293f315eb6295deed2003c5082}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: weather_pipeline
      DB_USER: postgres
      DB_PASSWORD: postgres_pwd
    volumes:
      - ./logs:/app/logs
    restart: on-failure

volumes:
  postgres_data:
